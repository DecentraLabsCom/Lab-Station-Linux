name: Dependency review

on:
  pull_request:
    paths:
      - "**/go.mod"
      - "**/go.sum"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/Pipfile.lock"
      - "**/poetry.lock"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "**/Cargo.lock"
      - "**/composer.lock"
      - "**/Gemfile.lock"
      - "**/pom.xml"
      - "**/build.gradle"
      - "**/build.gradle.kts"
      - "**/gradle.lockfile"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
