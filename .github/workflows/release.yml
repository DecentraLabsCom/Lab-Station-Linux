name: Linux agent release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag; leave empty to validate the current branch
        required: false
        type: string
      dry_run:
        description: Build and verify signed artifacts without publishing a prerelease
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and optionally publish signed Linux assets
    runs-on: ubuntu-24.04
    environment: MiniSign
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      OUTPUT_DIR: ${{ github.workspace }}/dist/release
      RELEASE_NOTES_PATH: ${{ github.workspace }}/dist/release-notes.md
    steps:
      - name: Check out the release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Validate release tag and source revision
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          source_commit=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$INPUT_TAG" ]]; then
            if [[ "$DRY_RUN" != true ]]; then
              echo 'A release tag is required when dry_run is false.' >&2
              exit 2
            fi
            release_tag="v$(tr -d '\r\n' < VERSION)"
          else
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must use vX.Y.Z: $release_tag" >&2
              exit 2
            fi
          fi
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$source_commit" origin/main || {
            echo "Source revision must be contained in origin/main" >&2
            exit 2
          }
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z: $release_tag" >&2
            exit 2
          fi
          version=${release_tag#v}
          test "$(tr -d '\r\n' < VERSION)" = "$version" || {
            echo "Tag $release_tag does not match VERSION $(cat VERSION)" >&2
            exit 2
          }
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read pinned Gateway contract revision
        id: gateway-contract
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print("commit=" + json.loads(Path("contracts/station/schema-bundle.lock.json").read_text())["commit"])
          PY

      - name: Check out the canonical Gateway contract source
        uses: actions/checkout@v7
        with:
          repository: DecentraLabsCom/Lab-Gateway
          ref: ${{ steps.gateway-contract.outputs.commit }}
          path: .gateway-contract-source

      - name: Verify the pinned station contract bundle
        run: python3 .gateway-contract-source/scripts/verify_station_contract_bundle.py --station-root "$GITHUB_WORKSPACE" --canonical-root "$GITHUB_WORKSPACE/.gateway-contract-source"

      - name: Read pinned FMU Executor commit
        id: fmu-pin
        run: echo "commit=$(tr -d '\r\n' < internal/agent/fmu_executor_commit.txt)" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned FMU Executor source
        uses: actions/checkout@v7
        with:
          repository: DecentraLabsCom/FMU-Executor
          ref: ${{ steps.fmu-pin.outputs.commit }}
          path: .fmu-executor-source

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install package and signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm minisign
          sudo gem install --no-document fpm --version 1.18.0

      - name: Verify formatting, vet, tests, and FMU bundles
        env:
          FMU_EXECUTOR_SOURCE: ${{ github.workspace }}/.fmu-executor-source
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          sh packaging/test-build.sh

      - name: Prepare Minisign keys
        env:
          MINISIGN_SECRET_KEY_BASE64: ${{ secrets.MINISIGN_SECRET_KEY_BASE64 }}
          MINISIGN_PUBLIC_KEY_BASE64: ${{ vars.MINISIGN_PUBLIC_KEY_BASE64 }}
        run: |
          set -eu
          test -n "$MINISIGN_SECRET_KEY_BASE64" || { echo 'Set MiniSign environment secret MINISIGN_SECRET_KEY_BASE64.' >&2; exit 2; }
          test -n "$MINISIGN_PUBLIC_KEY_BASE64" || { echo 'Set MiniSign environment variable MINISIGN_PUBLIC_KEY_BASE64.' >&2; exit 2; }
          private_key="$RUNNER_TEMP/minisign.key"
          public_key="$RUNNER_TEMP/minisign.pub"
          printf '%s' "$MINISIGN_SECRET_KEY_BASE64" | base64 --decode > "$private_key"
          printf '%s' "$MINISIGN_PUBLIC_KEY_BASE64" | base64 --decode > "$public_key"
          chmod 600 "$private_key"
          test -s "$private_key" && test -s "$public_key"
          echo "MINISIGN_SECRET_KEY=$private_key" >> "$GITHUB_ENV"
          echo "MINISIGN_PUBLIC_KEY_FILE=$public_key" >> "$GITHUB_ENV"

      - name: Build and verify release assets
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FMU_EXECUTOR_SOURCE: ${{ github.workspace }}/.fmu-executor-source
        run: sh packaging/release.sh

      - name: Publish GitHub prerelease
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Lab Station Linux v${{ steps.release.outputs.version }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          prerelease: true
          make_latest: false
          files: |
            ${{ env.OUTPUT_DIR }}/lab-station-linux-*
            ${{ env.OUTPUT_DIR }}/SHA256SUMS
            ${{ env.OUTPUT_DIR }}/SHA256SUMS.minisig
            ${{ env.OUTPUT_DIR }}/minisign.pub
