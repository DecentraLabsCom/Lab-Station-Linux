name: Linux agent build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.23.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned Gateway contract revision
        id: gateway-contract
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print("commit=" + json.loads(Path("contracts/station/schema-bundle.lock.json").read_text())["commit"])
          PY
      - uses: actions/checkout@v7
        with:
          repository: DecentraLabsCom/Lab-Gateway
          ref: ${{ steps.gateway-contract.outputs.commit }}
          path: .gateway-contract-source
      - name: Verify pinned canonical station contract bundle
        run: python3 .gateway-contract-source/scripts/verify_station_contract_bundle.py --station-root "$GITHUB_WORKSPACE" --canonical-root "$GITHUB_WORKSPACE/.gateway-contract-source"
      - name: Read pinned FMU Executor commit
        id: fmu-pin
        run: echo "commit=$(tr -d '\r\n' < internal/agent/fmu_executor_commit.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: DecentraLabsCom/FMU-Executor
          ref: ${{ steps.fmu-pin.outputs.commit }}
          path: .fmu-executor-source
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Run go vet
        run: go vet ./...
      - name: Run unit tests with race detection and coverage
        env:
          FMU_EXECUTOR_SOURCE: ${{ github.workspace }}/.fmu-executor-source
        run: go test -race -cover ./...
      - name: Smoke test amd64 and arm64 release bundles
        env:
          FMU_EXECUTOR_SOURCE: ${{ github.workspace }}/.fmu-executor-source
        run: sh packaging/test-build.sh
      - name: Check release validation rejects incomplete configuration
        run: sh packaging/test-release.sh
      - name: Smoke test optional FMU-free bundles
        run: env -u FMU_EXECUTOR_SOURCE sh packaging/test-build.sh
      - name: Smoke test installer in a disposable container
        run: docker run --rm -v "${{ github.workspace }}:/src" -w /src public.ecr.aws/docker/library/golang:1.27.0 sh -lc 'export PATH=/usr/local/go/bin:$PATH; sh packaging/test-install.sh'
      - name: Exercise privileged setup in a disposable container
        run: docker run --rm -v "${{ github.workspace }}:/src" -w /src public.ecr.aws/docker/library/golang:1.27.0 sh -lc 'export PATH=/usr/local/go/bin:$PATH; apt-get update; apt-get install -y sudo; sh packaging/test-setup.sh'

  distro-setup-smoke:
    name: Setup smoke (${{ matrix.distro.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: ubuntu-24.04
            image: public.ecr.aws/docker/library/ubuntu:24.04
            package-manager: apt
          - name: rocky-9
            image: quay.io/rockylinux/rockylinux:9
            package-manager: dnf
          - name: opensuse-leap-16
            image: registry.opensuse.org/opensuse/leap:16.0
            package-manager: zypper
          - name: devuan-6-excalibur
            image: devuan/devuan:excalibur
            package-manager: apt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the setup integration test once
        run: go test -c -o "$RUNNER_TEMP/labstation-agent.test" ./internal/agent
      - name: Run setup integration in the target distribution image
        env:
          DISTRO_IMAGE: ${{ matrix.distro.image }}
          PACKAGE_MANAGER: ${{ matrix.distro.package-manager }}
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/src:ro"
          --volume "$RUNNER_TEMP/labstation-agent.test:/labstation-agent.test:ro"
          --env LABSTATION_SETUP_TEST_BINARY=/labstation-agent.test
          --env LABSTATION_CI_PACKAGE_MANAGER="$PACKAGE_MANAGER"
          --workdir /src
          "$DISTRO_IMAGE"
          sh -lc '
            case "$LABSTATION_CI_PACKAGE_MANAGER" in
              apt) apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo ;;
              dnf) dnf -y install sudo ;;
              zypper) zypper --non-interactive refresh && zypper --non-interactive install --no-recommends -y sudo ;;
              *) echo "Unsupported distro package manager" >&2; exit 2 ;;
            esac
            sh packaging/test-setup.sh
          '

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile native Linux commands
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build ./...

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned FMU Executor commit
        id: fmu-pin
        run: echo "commit=$(tr -d '\r\n' < internal/agent/fmu_executor_commit.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: DecentraLabsCom/FMU-Executor
          ref: ${{ steps.fmu-pin.outputs.commit }}
          path: .fmu-executor-source
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Debian and RPM packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm --version 1.18.0
      - name: Build .deb and .rpm packages for amd64 and arm64
        env:
          FMU_EXECUTOR_SOURCE: ${{ github.workspace }}/.fmu-executor-source
        run: |
          sh packaging/build.sh
          sh packaging/build-packages.sh
      - name: Verify package metadata and architecture
        run: |
          version=$(cat VERSION)
          test "$(dpkg-deb -f "dist/lab-station-linux_${version}_amd64.deb" Architecture)" = amd64
          test "$(dpkg-deb -f "dist/lab-station-linux_${version}_arm64.deb" Architecture)" = arm64
          test "$(rpm -qp --queryformat '%{ARCH}' "dist/lab-station-linux-${version}.x86_64.rpm")" = x86_64
          test "$(rpm -qp --queryformat '%{ARCH}' "dist/lab-station-linux-${version}.aarch64.rpm")" = aarch64
